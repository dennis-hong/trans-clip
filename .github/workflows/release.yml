name: release

on:
  push:
    tags:
      - "v*"
  # Dry run: builds, signs and verifies exactly like a release, but publishes nothing.
  # Use it after touching the signing secrets:  gh workflow run release.yml
  workflow_dispatch:

jobs:
  release-macos-aarch64:
    runs-on: macos-latest
    # A normal run takes 8-10 minutes; without a limit a stuck step holds the runner for 6 hours.
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Validate signing key
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is not set."
            exit 1
          fi

      - name: Validate updater public key
        shell: bash
        run: |
          PUBKEY="$(node -e 'const fs=require("fs");const conf=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8"));process.stdout.write(conf?.plugins?.updater?.pubkey ?? "")')"
          if [ -z "${PUBKEY}" ] || [ "${PUBKEY}" = "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY" ]; then
            echo "Updater public key is not configured in src-tauri/tauri.conf.json"
            echo "Set plugins.updater.pubkey to the generated public key before release."
            exit 1
          fi

      - name: Validate code signing inputs
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CODESIGN_P12_BASE64:-}" ] || [ -z "${CODESIGN_P12_PASSWORD:-}" ]; then
            echo "::error::CODESIGN_P12_BASE64 / CODESIGN_P12_PASSWORD secrets are not set."
            echo "::error::Run 'scripts/codesign.sh setup' once and register the secrets (see .claude/commands/release.md)."
            exit 1
          fi
          if [ ! -s .github/codesign-cert.sha1 ]; then
            echo "::error::.github/codesign-cert.sha1 is missing. 'scripts/codesign.sh setup' creates it; commit it."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # macOS remembers Accessibility / Keychain grants by the app's code-signing requirement.
      # Every release is signed with the same self-signed identity so that requirement never
      # changes and users keep their permissions across updates. See scripts/codesign.sh.
      - name: Import code signing identity
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/transclip-signing.keychain-db"
          PEM="${RUNNER_TEMP}/transclip-signing.pem"
          SHA1="$(tr -d '[:space:]' < .github/codesign-cert.sha1)"

          CODESIGN_KEYCHAIN_PATH="${KEYCHAIN}" ./scripts/codesign.sh import

          # Make the temporary keychain visible to codesign.
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')

          # codesign refuses identities that are not trusted for code signing. The runner is
          # ephemeral, so trusting the certificate here affects this job only. End-user machines
          # never need to trust it: macOS permissions only compare the requirement string.
          if ! sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "${PEM}"; then
            echo "::warning::Admin-domain trust failed; falling back to the user domain."
            security add-trusted-cert -r trustRoot -p codeSign -k "${KEYCHAIN}" "${PEM}"
          fi

          VALID="$(security find-identity -v -p codesigning "${KEYCHAIN}")"
          echo "${VALID}"
          if ! printf '%s' "${VALID}" | grep -qi "${SHA1}"; then
            echo "::error::The signing identity is not valid for code signing (trust step failed)."
            security find-identity -p codesigning "${KEYCHAIN}" || true
            exit 1
          fi

      - name: Build signed app and updater artifacts
        run: pnpm tauri build --target aarch64-apple-darwin

      # Hard gate: a build that does not carry the pinned requirement would reset every user's
      # Accessibility / Keychain grants, so it must never be published.
      - name: Verify code signing identity
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          ./scripts/codesign.sh verify "${BUNDLE_DIR}/TransClip.app"
          ./scripts/codesign.sh verify "${BUNDLE_DIR}/TransClip.app.tar.gz"

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          APP_DIR="${BUNDLE_DIR}/TransClip.app"
          UPDATER_ARCHIVE="${BUNDLE_DIR}/TransClip.app.tar.gz"
          SIG_FILE="${UPDATER_ARCHIVE}.sig"
          ZIP_NAME="TransClip_${VERSION}_aarch64.app.zip"
          ZIP_PATH="${BUNDLE_DIR}/${ZIP_NAME}"
          LATEST_JSON="${BUNDLE_DIR}/latest.json"

          if [ ! -d "${APP_DIR}" ]; then
            echo "Missing app bundle: ${APP_DIR}"
            exit 1
          fi
          if [ ! -f "${UPDATER_ARCHIVE}" ]; then
            echo "Missing updater archive: ${UPDATER_ARCHIVE}"
            exit 1
          fi
          if [ ! -f "${SIG_FILE}" ]; then
            echo "Missing updater signature: ${SIG_FILE}"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "${APP_DIR}" "${ZIP_PATH}"

          SIGNATURE="$(tr -d '\n' < "${SIG_FILE}")"
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cat > "${LATEST_JSON}" <<EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes on GitHub.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIGNATURE}",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/TransClip.app.tar.gz"
              }
            }
          }
          EOF

          {
            echo "tag=${TAG}"
            echo "updater_archive=${UPDATER_ARCHIVE}"
            echo "updater_sig=${SIG_FILE}"
            echo "latest_json=${LATEST_JSON}"
            echo "manual_zip=${ZIP_PATH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.prep.outputs.updater_archive }}
            ${{ steps.prep.outputs.updater_sig }}
            ${{ steps.prep.outputs.latest_json }}
            ${{ steps.prep.outputs.manual_zip }}

      # Best-effort only: the runner is an ephemeral VM, so the keychain and the trust setting are
      # discarded with it. `sudo security remove-trusted-cert -d` used to live here and hung the job
      # for hours (admin-domain trust changes can wait on an interactive authorization), so it is
      # gone, and this step is bounded so that a hang here can never stall or fail a release.
      - name: Remove signing identity
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "${CODESIGN_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${CODESIGN_KEYCHAIN_PATH}" || true
          fi
